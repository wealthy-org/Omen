[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
sepolia = "${ETH_SEPOLIA_RPC}"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api" }
